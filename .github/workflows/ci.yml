name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive_format: tar.gz
            binary: target/release/aero1394
          - os: windows-latest
            platform: windows-x86_64
            archive_format: zip
            binary: target/release/aero1394.exe

    steps:
      - uses: actions/checkout@v7
      - name: Show active toolchain
        run: rustup show active-toolchain
      - name: Check requirements trace matrix
        run: python scripts/build-trace-matrix.py --check
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Build locked release binary
        run: cargo build --release --locked
      - name: Package and smoke-test release artifact
        run: >-
          python scripts/package-release.py
          --platform ${{ matrix.platform }}
          --archive-format ${{ matrix.archive_format }}
          --binary ${{ matrix.binary }}
      - name: Retain release candidate artifact
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: aero1394-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
